name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: psf/black@782e5605c86aab56be6f905da10dcd3e463fd9c2 # 25.12.0

  tests:
    name: "Node CI"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      # Checkout the Repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      # Install Node 22
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm i

      - name: Install Chrome for Puppeteer (necessary because it doesn't get cached)
        run: pnpm install-puppeteer-browser

      - name: Lint Files
        run: pnpm lint

      - name: Verify Build
        run: pnpm build

      - name: Run Tests
        run: pnpm test

  python-tests:
    name: "Python CI"
    runs-on: ubuntu-latest
    steps:
      # Checkout the Repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Just to run the script
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      # Install Python
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.x

      - name: Run Tests
        run: pnpm run test:python
